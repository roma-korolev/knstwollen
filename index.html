<style>
  :root{
    --fg:#000;
    --bg:#fff;
    --marginX: 9vw;
    --marginY: 5svh;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0;
    background:var(--bg); color:var(--fg);
    font-family:'IBM Plex Mono', monospace;
    width:100%; overflow-x:hidden;
  }
  html{
    scroll-snap-type:y mandatory;
  }
  body{
    opacity:0;
    transition:opacity .5s ease;
  }
  body.ready{ opacity:1; }
  a{ color:inherit; text-decoration:none; }

  /* =========================================================
     BLOCK 1 — logo + social links (100%)
     ========================================================= */
  .screen1{
    height:100svh;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:9vw 9vw 7vw;
  }

  .logo-area{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .logo-block{
    width:34vw;
    max-width:230px;
  }
  .logo-block img{
    width:100%;
    height:auto;
    display:block;
  }
  .social-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    max-width:280px;
    margin:0 auto;
  }
  .social-row a{
    font-size:15px;
    letter-spacing:0.02em;
    color:var(--fg);
    transition:opacity .15s ease;
  }
  .social-row a:active{ opacity:0.45; }
  @media (hover:hover){
    .social-row a:hover{ opacity:0.5; }
  }

  /* =========================================================
     BLOCK 2 — 3D projects carousel (100%)
     ========================================================= */
  .screen2{
    height:100svh;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    position:relative;
    overflow:hidden;
    background:#f0f0ef;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:var(--marginY) 0;
  }

  /* smooth white -> light-gray handoff between the title screen and
     the projects screen */
  .screen-transition{
    height:10svh;
    background:linear-gradient(to bottom, var(--bg) 0%, #f0f0ef 100%);
  }

  /* blurred backdrop of the active photo — confined to this section only,
     so it only ever colors the bottom half of the page */
  .screen2-bg{
    display:none;
  }

  .carousel3d-wrap{
    position:relative;
    z-index:1;
    width:100%;
    padding:0 var(--marginX);
    touch-action:pan-y;
  }
  .carousel3d{
    position:relative;
    width:100%;
    max-width:340px;
    aspect-ratio:3/4;
    margin:0 auto;
    perspective:1100px;
  }
  .card3d{
    position:absolute;
    inset:0;
    overflow:hidden;
    cursor:pointer;
    will-change:transform, opacity;
    backface-visibility:hidden;
  }
  .card3d img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    display:block;
    -webkit-user-drag:none;
    user-select:none;
    pointer-events:none;
  }
  .card3d img.align-left{
    object-position:left center;
  }

  .carousel3d-caption{
    position:relative;
    z-index:1;
    width:100%;
    max-width:340px;
    margin:18px auto 0;
    text-align:center;
  }

    margin-top:26px;

    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
    cursor:pointer;

  .dots i::before{
    content:"";
    width:4px;
    height:4px;
    border-radius:50%;
    background:var(--fg);
    opacity:0.25;
    transition:opacity .2s ease, width .2s ease, height .2s ease;
  }
  .dots i.active::before{
    opacity:1;
    width:5px;
    height:5px;
  }

  .section-heading{
    position:absolute;
    top:var(--marginY);
    left:var(--marginX);
    z-index:2;
    text-align:left;
    font-size:13px;
    letter-spacing:0.12em;

  .screen3-scrim{
    position:absolute;

    display:flex;
    align-items:flex-end;
    justify-content:flex-start;
    padding:0 9vw 7vw;
    background:linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.82) 65%, rgba(0,0,0,0.9) 100%);
  }
  .screen3-names{
    width:100%;
    color:#fff;
    text-align:left;
    font-size:clamp(11px, 3.4vw, 15px);
    line-height:1.5;
    letter-spacing:0.01em;
  }

  /* =========================================================
     LIGHTBOX — telegram-style fullscreen preview with pinch-zoom
     ========================================================= */
  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.92);
    z-index:1000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px;
    opacity:0;
    visibility:hidden;
    transition:opacity .25s ease, visibility 0s linear .25s;
  }
  .lightbox.open{
    opacity:1;
    visibility:visible;
    transition:opacity .25s ease;
  }
  .lightbox-frame{
    position:relative;
    width:100%;
    max-width:92vw;
    max-height:76svh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    touch-action:none;
  }
  .lightbox img{
    display:block;
    max-width:100%;
    max-height:76svh;
    width:auto;
    height:auto;
    object-fit:contain;
    transform-origin:center center;
    transform:scale(0.94);
    transition:transform .25s ease;
    -webkit-user-drag:none;
    user-select:none;
  }
  .lightbox.open img{
    transform:scale(1);
  }
  .lightbox.open img.zooming{
    transition:none;
  }
  .lightbox-caption{
    width:100%;
    max-width:min(86vw, 420px);
    text-align:center;
    color:#fff;
    margin-top:16px;
  }
  .lightbox-caption .title{
    font-size:13px;
    line-height:1.45;
  }
  .lightbox-caption .date{
    font-size:11px;
    opacity:0.5;
    margin-top:4px;
  }
  .lightbox-close{
    position:fixed;
    top:calc(env(safe-area-inset-top, 0px) + 16px);
    right:calc(env(safe-area-inset-right, 0px) + 16px);
    width:40px;
    height:40px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,0.12);
    color:#fff;
    font-family:'IBM Plex Mono', monospace;
    font-size:22px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:1001;
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
    transition:background .15s ease, transform .15s ease;
  }
  .lightbox-close:active{
    transform:scale(0.9);
    background:rgba(255,255,255,0.22);
  }
</style>

<script>
  // ---- instagram / telegram: try to open the native app first,
  // fall back to the web page if the app isn't installed ----
  document.querySelectorAll('.app-link').forEach((link) => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      const webUrl = link.getAttribute('href');
      const appUrl = link.getAttribute('data-app');
      let leftPage = false;
      function onHide(){ leftPage = true; }
      document.addEventListener('visibilitychange', onHide, { once:true });
      window.location.href = appUrl;
      setTimeout(() => {
        document.removeEventListener('visibilitychange', onHide);
        if (!leftPage){
          window.open(webUrl, '_blank', 'noopener');
        }
      }, 1200);
    });
  });

  // ---- project data ----
  // align:'left' -> when this thumbnail gets cropped by object-fit:cover,
  // keep the LEFT side of the photo instead of the center
  const SLIDES = [
    { src:'assets/2.JPG', title:'Комплект барной мебели "Сервиз"', date:'Москва | 2026' },
    { src:'assets/3.JPG', title:'Концепция | фотобудка "В ритме мегаполиса"', date:'Москва | 2026', align:'left' },
    { src:'assets/4.JPG', title:'Концепция | реновация интерьера бара "Ровестник"', date:'Москва | 2026' },
    { src:'assets/5.JPG', title:'Концепция | ленд арт для фестиваля "Архстояние"', date:'Никола-Ленивец | 2025' }
  ];
  const N = SLIDES.length;

  const carousel3dWrap = document.getElementById('carousel3dWrap');
  const carousel3d = document.getElementById('carousel3d');
  const dotsWrap = document.getElementById('dots');
  const bgLayerA = document.getElementById('bgLayerA');
  const bgLayerB = document.getElementById('bgLayerB');
  const c3dTitle = document.getElementById('c3dTitle');
  const c3dDate = document.getElementById('c3dDate');

  // ---- lightbox: tap a photo to open it fullscreen, telegram-style, with
  // pinch-to-zoom / double-tap-to-zoom / pan, and the full uncropped image ----
  const lightbox = document.getElementById('lightbox');
  const lightboxFrame = document.getElementById('lightboxFrame');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxTitle = document.getElementById('lightboxTitle');
  const lightboxDate = document.getElementById('lightboxDate');
  const lightboxClose = document.getElementById('lightboxClose');

  let zScale = 1, zX = 0, zY = 0;
  const ZOOM_MAX = 4, ZOOM_MIN = 1;

  function applyZoom(animate){
    lightboxImg.classList.toggle('zooming', !animate);
    lightboxImg.style.transform = `translate(${zX}px, ${zY}px) scale(${zScale})`;
  }
  function clampPan(){
    // keep the image roughly on-screen once zoomed in
    const rect = lightboxFrame.getBoundingClientRect();
    const maxX = (rect.width * (zScale - 1)) / 2 + rect.width * 0.15;
    const maxY = (rect.height * (zScale - 1)) / 2 + rect.height * 0.15;
    zX = Math.max(-maxX, Math.min(maxX, zX));
    zY = Math.max(-maxY, Math.min(maxY, zY));
  }
  function resetZoom(){
    zScale = 1; zX = 0; zY = 0;
    applyZoom(true);
  }

  function distance(t0, t1){
    return Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
  }
  function midpoint(t0, t1){
    return { x:(t0.clientX + t1.clientX) / 2, y:(t0.clientY + t1.clientY) / 2 };
  }

  let pinchActive = false, pinchStartDist = 0, pinchStartScale = 1;
  let panActive = false, panStartX = 0, panStartY = 0, panStartZX = 0, panStartZY = 0;
  let lastTapTime = 0, lastTapX = 0, lastTapY = 0;

  lightboxFrame.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2){
      pinchActive = true;
      panActive = false;
      pinchStartDist = distance(e.touches[0], e.touches[1]);
      pinchStartScale = zScale;
    } else if (e.touches.length === 1){
      const t = e.touches[0];
      const now = Date.now();
      const dt = now - lastTapTime;
      const closeTap = Math.hypot(t.clientX - lastTapX, t.clientY - lastTapY) < 40;
      if (dt < 320 && closeTap){
        // double tap: toggle zoom
        if (zScale > 1.01){
          resetZoom();
        } else {
          zScale = 2.4;
          zX = 0; zY = 0;
          applyZoom(true);
        }
        lastTapTime = 0;
      } else {
        lastTapTime = now;
        lastTapX = t.clientX;
        lastTapY = t.clientY;
      }
      if (zScale > 1.01){
        panActive = true;
        panStartX = t.clientX;
        panStartY = t.clientY;
        panStartZX = zX;
        panStartZY = zY;
      }
    }
  }, { passive:true });

  lightboxFrame.addEventListener('touchmove', (e) => {
    if (pinchActive && e.touches.length === 2){
      e.preventDefault();
      const dist = distance(e.touches[0], e.touches[1]);
      zScale = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, pinchStartScale * (dist / pinchStartDist)));
      clampPan();
      applyZoom(false);
    } else if (panActive && e.touches.length === 1 && zScale > 1.01){
      e.preventDefault();
      const t = e.touches[0];
      zX = panStartZX + (t.clientX - panStartX);
      zY = panStartZY + (t.clientY - panStartY);
      clampPan();
      applyZoom(false);
    }
  }, { passive:false });

  function endTouch(){
    pinchActive = false;
    panActive = false;
    if (zScale < 1.01){
      resetZoom();
    } else {
      applyZoom(true);
    }
  }
  lightboxFrame.addEventListener('touchend', endTouch);
  lightboxFrame.addEventListener('touchcancel', endTouch);

  // desktop convenience: wheel to zoom, double-click to toggle zoom
  lightboxFrame.addEventListener('wheel', (e) => {
    e.preventDefault();
    zScale = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, zScale - e.deltaY * 0.0025));
    clampPan();
    applyZoom(false);
  }, { passive:false });
  lightboxFrame.addEventListener('dblclick', () => {
    if (zScale > 1.01){ resetZoom(); }
    else { zScale = 2.4; applyZoom(true); }
  });

  function openLightbox(realIndex){
    const data = SLIDES[realIndex];
    resetZoom();
    lightboxImg.src = data.src;
    lightboxImg.alt = data.title;
    lightboxTitle.textContent = data.title;
    lightboxDate.textContent = data.date;
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox(){
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
    resetZoom();
  }
  lightboxClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox(); // tap on the dark backdrop, not the photo
  });

  // =========================================================
  // 3D coverflow carousel — smooth, transform-based, infinite loop,
  // driven by pointer events (works for touch, mouse and pen alike)
  // =========================================================
  const cardEls = SLIDES.map((data, i) => {
    const card = document.createElement('div');
    card.className = 'card3d';
    const img = document.createElement('img');
    img.src = data.src;
    img.alt = data.title;
    img.loading = 'lazy';
    img.draggable = false;
    if (data.align === 'left') img.classList.add('align-left');
    card.appendChild(img);
    card.dataset.index = String(i);
    carousel3d.appendChild(card);
    return card;
  });

  SLIDES.forEach((_, i) => {
    const dot = document.createElement('i');
    if (i === 0) dot.classList.add('active');
    dot.addEventListener('click', () => {
      baseIndex = i;
      render(baseIndex, true);
      syncUI();
    });
    dotsWrap.appendChild(dot);
  });
  const dotEls = Array.from(dotsWrap.children);

  let baseIndex = 0;
  let currentReal = -1;
  let bgToggle = false;

  function wrapDiff(diff){
    while (diff > N / 2) diff -= N;
    while (diff <= -N / 2) diff += N;
    return diff;
  }

  // ---- "включалка" для соседних карточек в карусели ----
  // false: видно только текущее фото, соседние полностью скрыты
  // true:  соседние фото немного видны и уменьшены по бокам (как раньше)
  const SHOW_NEIGHBOR_CARDS = false;

  function render(current, animate){
    cardEls.forEach((el, i) => {
      const diff = wrapDiff(i - current);
      const absDiff = Math.abs(diff);
      let translateX, scale, opacity;
      if (SHOW_NEIGHBOR_CARDS){
        // flat carousel: no rotation/tilt — only translateX + scale, so the
        // two neighboring photos sit flush next to the center one
        translateX = diff * 78;
        scale = Math.max(1 - absDiff * 0.24, 0.3);
        opacity = Math.max(1 - absDiff * 0.55, 0);
      } else {
        // only the active photo is shown; neighbors wait just off to the
        // side (still animated during a swipe) and fade out before they
        // become visible
        translateX = diff * 100;
        scale = 1;
        opacity = Math.max(1 - absDiff * 2, 0);
      }
      const visible = opacity > 0.03;
      el.style.transition = animate
        ? 'transform .5s cubic-bezier(.22,.68,0,1), opacity .5s ease'
        : 'none';
      el.style.transform = `translateX(${translateX}%) scale(${scale})`;
      el.style.opacity = String(opacity);
      el.style.pointerEvents = visible ? 'auto' : 'none';
      el.style.zIndex = String(Math.round(100 - absDiff * 10));
    });
  }

  function updateDots(realIndex){
    dotEls.forEach((d, i) => d.classList.toggle('active', i === realIndex));
  }

  // crossfades the blurred backdrop between two stacked layers so the
  // change never pops — only ever painted behind this section
  function updateBg(realIndex){
    const src = SLIDES[realIndex].src;
    const show = bgToggle ? bgLayerA : bgLayerB;
    const hide = bgToggle ? bgLayerB : bgLayerA;
    show.style.backgroundImage = `url(${src})`;
    requestAnimationFrame(() => {
      show.classList.add('active');
      hide.classList.remove('active');
    });
    bgToggle = !bgToggle;
  }

  function setCaption(realIndex){
    c3dTitle.textContent = SLIDES[realIndex].title;
    c3dDate.textContent = SLIDES[realIndex].date;
  }

  function syncUI(){
    if (baseIndex === currentReal) return;
    currentReal = baseIndex;
    updateDots(currentReal);
    updateBg(currentReal);
    setCaption(currentReal);
  }

  function onCardClick(i){
    if (dragMoved) return;
    const diff = Math.round(wrapDiff(i - baseIndex));
    if (diff === 0){
      openLightbox(i);
    } else {
      baseIndex = i;
      render(baseIndex, true);
      syncUI();
    }
  }

  // ---- drag / swipe handling (pointer events cover touch + mouse) ----
  let dragging = false, dragMoved = false, dragStartX = 0, dragUnits = 0, cardWidth = 1;

  carousel3dWrap.addEventListener('pointerdown', (e) => {
    dragging = true;
    dragMoved = false;
    dragUnits = 0;
    dragStartX = e.clientX;
    cardWidth = carousel3d.getBoundingClientRect().width || 1;
    try { carousel3dWrap.setPointerCapture(e.pointerId); } catch(err){}
  });

  carousel3dWrap.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - dragStartX;
    if (Math.abs(dx) > 4) dragMoved = true;
    dragUnits = dx / cardWidth;
    render(baseIndex - dragUnits, false);
  });

  function endDrag(e){
    if (!dragging) return;
    dragging = false;
    const wasTap = !dragMoved;
    // resolve which card was tapped ourselves: once the wrapper has pointer
    // capture, the browser's own 'click' event no longer reaches the card,
    // so a listener on the card itself never fires
    let tappedIndex = null;
    if (wasTap && e && typeof e.clientX === 'number'){
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const card = el && el.closest ? el.closest('.card3d') : null;
      if (card && card.dataset.index !== undefined) tappedIndex = parseInt(card.dataset.index, 10);
    }
    if (Math.abs(dragUnits) > 0.18){
      const delta = dragUnits > 0 ? -1 : 1;
      baseIndex = ((baseIndex + delta) % N + N) % N;
    }
    dragUnits = 0;
    render(baseIndex, true);
    syncUI();
    if (tappedIndex !== null) onCardClick(tappedIndex);
  }
  carousel3dWrap.addEventListener('pointerup', endDrag);
  carousel3dWrap.addEventListener('pointercancel', () => endDrag(null));
  carousel3dWrap.addEventListener('pointerleave', (e) => { if (dragging) endDrag(null); });

  window.addEventListener('resize', () => {
    render(baseIndex, false);
  });
  window.addEventListener('orientationchange', () => {
    render(baseIndex, false);
  });

  // ---- initial state ----
  render(0, false);
  updateDots(0);
  setCaption(0);
  bgLayerA.style.backgroundImage = `url(${SLIDES[0].src})`;
  bgLayerA.classList.add('active');
  bgToggle = true;
  currentReal = 0;

  // ---- open the site scrolled to the bottom, then glide up to the top ----
  // (custom animation instead of native smooth-scroll so the speed is
  // controllable)
  function smoothScrollTo(targetY, duration){
    const startY = window.scrollY;
    const diff = targetY - startY;
    const start = performance.now();
    function easeInOutQuad(t){ return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2) / 2; }
    function step(now){
      const t = Math.min((now - start) / duration, 1);
      window.scrollTo(0, startY + diff * easeInOutQuad(t));
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  window.scrollTo(0, document.documentElement.scrollHeight);
  document.body.classList.add('ready');
  window.requestAnimationFrame(() => {
    window.scrollTo(0, document.documentElement.scrollHeight);
    setTimeout(() => {
      smoothScrollTo(0, 1600);
    }, 300);
  });
</script>
</body>
</html>
